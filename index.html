<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm and Music - Esplosione Musicale</title>
    <!-- Libreria per icone musicali giganti e potenti -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            background: radial-gradient(circle at center, #001f4d 0%, #000c1a 100%);
            color: #ffffff;
            font-family: 'Impact', 'Arial Black', sans-serif;
            margin: 0;
            padding: 50px 20px;
            text-align: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* SFONDO DA LOCANDINA: EFFETTI LUCE E NOTE GIGANTI */
        .luce-neon {
            position: fixed;
            top: -10%; left: 50%; transform: translateX(-50%);
            width: 100vw; height: 60vh;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.4) 0%, rgba(0, 71, 171, 0) 70%);
            z-index: -2;
            pointer-events: none;
        }
        
        .nota-esplosiva {
            position: absolute;
            color: rgba(0, 210, 255, 0.2);
            text-shadow: 0 0 20px #00D2FF;
            font-size: 5rem;
            user-select: none;
            z-index: -1;
        }

        /* TITOLO DA CONCERTO ROCK */
        header h1 {
            font-size: 5.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #ffffff 20%, #00D2FF 50%, #FFD700 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 5px 15px rgba(0, 210, 255, 0.6));
        }

        .slogan-locandina {
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.4rem;
            font-weight: bold;
            max-width: 900px;
            margin: 20px auto 40px auto;
            line-height: 1.6;
            background: linear-gradient(135deg, rgba(0, 71, 171, 0.8), rgba(0, 12, 26, 0.9));
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #00D2FF;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            color: #fff;
        }

        /* GRIGLIA STRUMENTI GIGANTI - VISIVI E IMPATTANTI */
        .locandina-strumenti {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .carta-strumento {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 210, 255, 0.3);
            padding: 25px;
            border-radius: 20px;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            font-size: 1.3rem;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .carta-strumento i {
            font-size: 3.5rem;
            color: #FFD700;
            filter: drop-shadow(0 0 10px #FFD700);
        }

        .carta-strumento:hover {
            transform: scale(1.15) rotate(3deg);
            border-color: #FFD700;
            background: rgba(0, 210, 255, 0.15);
            box-shadow: 0 0 30px #FFD700;
        }

        /* PANNELLO DIALOGO VETRO SCURO ULTRA-MODERNO */
        .contenitore-operativo {
            font-family: 'Segoe UI', sans-serif;
            background: rgba(0, 12, 26, 0.85);
            max-width: 750px;
            margin: 0 auto 50px auto;
            padding: 40px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            text-align: left;
        }

        .contenitore-operativo h2 {
            font-family: 'Impact', sans-serif;
            font-size: 2rem;
            color: #00D2FF;
            text-transform: uppercase;
            border-bottom: 2px solid #00D2FF;
            padding-bottom: 10px;
            margin-top: 0;
            letter-spacing: 1px;
        }

        .blocco-input { margin-bottom: 30px; }
        .blocco-input label { display: block; margin-bottom: 12px; font-weight: bold; font-size: 1.1rem; color: #00D2FF; }
        
        .blocco-input input, .blocco-input select {
            width: 100%; padding: 16px; border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px; background: rgba(255,255,255,0.05); color: white;
            font-size: 1.1rem; box-sizing: border-box; transition: 0.3s;
        }
        .blocco-input input:focus, .blocco-input select:focus { outline: none; border-color: #FFD700; background: rgba(255,255,255,0.1); }

        /* STRISCIA AUTORE E TASTO PIÙ GIGANTE */
        .riga-dinamica { display: flex; gap: 15px; margin-bottom: 12px; width: 100%; }
        .riga-dinamica input { flex-grow: 1; }
        
        .tasto-esplosivo-piu {
            background: #00D2FF; color: #000; border: none; padding: 0 25px;
            border-radius: 12px; cursor: pointer; font-weight: 900; font-size: 1.8rem;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }
        .tasto-esplosivo-piu:hover { background: #FFD700; transform: scale(1.1); box-shadow: 0 0 20px #FFD700; }

        /* INTERFACCIA CARICAMENTO AUDIO AUDIO */
        .zona-drop-totale {
            border: 3px dashed #00D2FF; padding: 50px 20px; text-align: center;
            border-radius: 20px; background: rgba(0, 210, 255, 0.03); cursor: pointer;
            transition: all 0.3s ease; position: relative;
        }
        .zona-drop-totale:hover { border-color: #FFD700; background: rgba(255, 215, 0, 0.05); }
        .zona-drop-totale i { font-size: 4rem; color: #00D2FF; margin-bottom: 15px; animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* SCHERMATA RISULTATI E BLOCCO PAYPAL */
        .blocco-successo-ia {
            background: rgba(40, 167, 69, 0.15); border: 2px solid #28a745;
            padding: 30px; border-radius: 20px; margin-top: 30px; box-shadow: 0 0 20px rgba(40,167,69,0.3);
        }

        .griglia-pulsanti { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
        @media(min-width: 600px) { .griglia-pulsanti { grid-template-columns: 1fr 1fr; } .esteso { grid-column: span 2; } }

        .pulsante-locandina {
            padding: 18px; border: none; border-radius: 12px; cursor: pointer;
            font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; box-sizing: border-box;
        }
        .pulsante-verde { background: #28a745; color: white; }
        .pulsante-verde:hover { transform: translateY(-3px); background: #218838; }
        .pulsante-oro { background: linear-gradient(135deg, #FFD700 0%, #ff9800 100%); color: #000; font-weight: 800; }
        .pulsante-oro:hover { transform: translateY(-3px); box-shadow: 0 5px 20px #FFD700; }

        .btn-contatta {
            background: transparent; border: 3px solid #00D2FF; color: #00D2FF;
            padding: 16px 50px; border-radius: 40px; cursor: pointer; font-weight: bold;
            font-size: 1.2rem; font-family: 'Impact', sans-serif; letter-spacing: 1px; margin-bottom: 60px; transition: 0.3s;
        }
        .btn-contatta:hover { background: #00D2FF; color: #000; box-shadow: 0 0 30px #00D2FF; }

        /* MODALE FINESTRA DIALOGO MESSAGGI */
        .finestra-messaggi {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000c1a; border: 3px solid #00D2FF; padding: 40px; border-radius: 24px;
            box-shadow: 0 0 50px rgba(0,210,255,0.5); z-index: 1000; width: 90%; max-width: 450px;
        }
        .finestra-messaggi textarea {
            width: 100%; height: 130px; margin-bottom: 25px; padding: 15px;
            background: rgba(255,255,255,0.05); border: 2px solid rgba(0, 210, 255, 0.3);
            color: white; border-radius: 10px; box-sizing: border-box; font-size: 1rem;
        }
        .oscuramento-sfondo { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; backdrop-filter: blur(5px); }
        footer { font-family: 'Segoe UI', sans-serif; font-size: 1rem; font-weight: bold; margin-top: 60px; opacity: 0.5; padding-bottom: 30px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="luce-neon"></div>
    
    <div class="nota-esplosiva" style="top: 10%; left: 5%;">𝄞</div>
    <div class="nota-esplosiva" style="top: 20%; right: 5%;">♫</div>
    <div class="nota-esplosiva" style="top: 70%; left: 8%;">♩</div>
    <div class="nota-esplosiva" style="top: 60%; right: 8%;">𝄢</div>

    <header>
        <h1>Rhythm and Music</h1>
        <div class="slogan-locandina">
            Prendiamo il tuo brano, lo scomponiamo ed estraiamo esattamente solo la traccia melodica principale per creare un pentagramma preciso e perfetto. Generiamo spartiti musicali da brani caricati in qualsiasi formato. Vi vengo a sfidare!
        </div>
    </header>

    <!-- GRIGLIA STRUMENTI VISIVA STILE LOCANDINA -->
    <div class="locandina-strumenti">
        <div class="carta-strumento"><i class="fa-solid fa-drum"></i>BATTERIA</div>
        <div class="carta-strumento"><i class="fa-solid fa-guitar"></i>CHITARRA</div>
